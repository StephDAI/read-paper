name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Syntax checks
        run: npm run check
      - name: Conversion smoke test (2 papers)
        run: PAPERS=2 node eval/eval.mjs
